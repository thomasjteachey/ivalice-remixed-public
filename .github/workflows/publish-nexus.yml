name: Publish Nexus release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish (for example, 0.9.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nexus-mod-187
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    environment: nexus

    steps:
      - name: Resolve release version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${DISPATCH_VERSION:-$RELEASE_TAG}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download tested GitHub release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          gh release download "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "IvaliceReMixed-$VERSION.zip" \
            --dir release
          test -f "release/IvaliceReMixed-$VERSION.zip"

      - name: Create and validate Nexus package
        id: package
        shell: python
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          import json
          import os
          import pathlib
          import re
          import zipfile

          version = os.environ["VERSION"]
          source = pathlib.Path("release") / f"IvaliceReMixed-{version}.zip"
          output_dir = pathlib.Path("release/nexus")
          output_dir.mkdir(parents=True, exist_ok=True)
          gameplay_root = "fftivc.gameplay.ivaliceremixed"
          eiu_root = "fftivc.utility.eventinstructionupgrade"
          expected_roots = {
              gameplay_root,
              eiu_root,
          }

          with zipfile.ZipFile(source) as archive:
              files = [entry for entry in archive.infolist() if not entry.is_dir()]
              roots = {pathlib.PurePosixPath(entry.filename).parts[0] for entry in files}
              if roots != expected_roots:
                  raise SystemExit(f"Unexpected release roots: {sorted(roots)}")

              for entry in files:
                  path = pathlib.PurePosixPath(entry.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {entry.filename}")

              names = {entry.filename for entry in files}
              for root in expected_roots:
                  required = f"{root}/ModConfig.json"
                  if required not in names:
                      raise SystemExit(f"Release is missing {required}")

              eiu_config = json.loads(archive.read(f"{eiu_root}/ModConfig.json"))
              eiu_version = str(eiu_config.get("ModVersion", ""))
              if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[.-][0-9A-Za-z.-]+)?", eiu_version):
                  raise SystemExit(f"Invalid Event Instruction Upgrade version: {eiu_version!r}")

              outputs = {
                  gameplay_root: output_dir / f"IvaliceReMixed-{version}.zip",
                  eiu_root: output_dir / f"EventInstructionUpgrade-{eiu_version}.zip",
              }
              for root, output in outputs.items():
                  selected = [entry for entry in files if pathlib.PurePosixPath(entry.filename).parts[0] == root]
                  with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as nexus:
                      for entry in selected:
                          nexus.writestr(entry, archive.read(entry))
                  print(f"Created {output} with {len(selected)} files")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"eiu_version={eiu_version}", file=output)

      - name: Find Event Instruction Upgrade file
        id: eiu_file
        shell: bash
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          mod_uid="$(curl --fail --silent --show-error \
            --header "apikey: $NEXUSMODS_API_KEY" \
            --header "User-Agent: Ivalice-ReMixed/release-workflow" \
            https://api.nexusmods.com/v1/games/finalfantasytacticstheivalicechronicles/mods/186.json |
            jq -er '.uid')"
          response="$(curl --fail --silent --show-error \
            --header "apikey: $NEXUSMODS_API_KEY" \
            --header "User-Agent: Ivalice-ReMixed/release-workflow" \
            "https://api.nexusmods.com/v3/mods/$mod_uid/files")"
          file_id="$(jq -er '.data.mod_files | map(select(.is_active == true)) |
            if length == 1 then .[0].id else error("Expected exactly one active EIU file, got \(length)") end' <<<"$response")"
          echo "file_id=$file_id" >> "$GITHUB_OUTPUT"

      - name: Upload Event Instruction Upgrade to Nexus Mods
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ steps.eiu_file.outputs.file_id }}
          filename: release/nexus/EventInstructionUpgrade-${{ steps.package.outputs.eiu_version }}.zip
          version: ${{ steps.package.outputs.eiu_version }}
          display_name: Event Instruction Upgrade ${{ steps.package.outputs.eiu_version }}
          description: Drag onto Reloaded-II. Needs the FFT Mod Loader. Enhanced mode.
          category: main
          archive_existing_version: "true"
          primary_mod_manager_download: "true"
          allow_mod_manager_download: "true"
          show_requirements_pop_up: "true"
          update_mod_version: "true"
          mod_id: 186

      - name: Upload Ivalice ReMixed to Nexus Mods
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: 8389512
          filename: release/nexus/IvaliceReMixed-${{ steps.version.outputs.version }}.zip
          version: ${{ steps.version.outputs.version }}
          display_name: Ivalice ReMixed ${{ steps.version.outputs.version }}
          description: Drag onto Reloaded-II with the Event Instruction Upgrade. Needs the FFT Mod Loader. Enhanced mode.
          category: main
          archive_existing_version: "true"
          primary_mod_manager_download: "true"
          allow_mod_manager_download: "true"
          show_requirements_pop_up: "true"
          update_mod_version: "true"
          mod_id: 187
